<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>省份 · 省会 大挑战</title>
<style>
  *{ margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; }
  body{ background:linear-gradient(150deg,#f6efe3,#e7f0e4 60%,#dceadf); color:#2f3b2f; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:24px 14px; }
  .back{ position:fixed; top:16px; left:16px; background:rgba(0,0,0,.06); color:#4c5b48; border:1px solid rgba(0,0,0,.14);
    padding:8px 14px; border-radius:10px; font-size:13px; text-decoration:none; z-index:20; }
  .back:hover{ background:rgba(0,0,0,.12); }
  h1{ font-size:28px; text-align:center; }
  h1 span{ color:#3f7d4e; }
  .sub{ color:#768a72; font-size:13px; margin-top:6px; text-align:center; }
  .card{ background:#fff; border-radius:20px; box-shadow:0 10px 30px rgba(63,110,74,.12); width:100%; max-width:560px; margin-top:22px; padding:26px; }
  .opt2{ margin:14px 0 4px; font-size:13px; font-weight:800; color:#6a7f66; letter-spacing:1px; }
  .segs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .seg{ flex:1; min-width:100px; padding:11px 8px; border-radius:11px; border:1.5px solid #cddbca; background:#f7faf6;
    color:#5d7159; font-weight:700; font-size:14px; cursor:pointer; transition:.2s; }
  .seg.on{ background:#3f7d4e; color:#fff; border-color:#3f7d4e; box-shadow:0 5px 14px rgba(63,125,78,.3); }
  .go{ width:100%; padding:15px; border:none; border-radius:14px; background:linear-gradient(120deg,#3f9d5c,#2e7d44);
    color:#fff; font-size:17px; font-weight:900; cursor:pointer; margin-top:18px; box-shadow:0 8px 20px rgba(46,125,68,.3); }
  .go:hover{ filter:brightness(1.08); transform:translateY(-2px); }
  .hud{ display:flex; justify-content:space-between; font-size:14px; color:#667a62; }
  .hud b{ font-size:17px; color:#2e7d44; }
  .bar{ height:9px; background:#e4ece2; border-radius:99px; margin:14px 0 18px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#8fd0a2,#2e9d58); width:0%; transition:.3s; border-radius:99px; }
  .qtag{ display:inline-block; font-size:12px; font-weight:800; color:#7a5b1e; background:#f7e7c3; padding:4px 12px; border-radius:99px; }
  .q{ text-align:center; margin:20px 0 22px; }
  .q .who{ font-size:26px; font-weight:900; color:#27382a; }
  .q .ask{ font-size:15px; color:#7c8f77; margin-top:8px; }
  .opts{ display:grid; gap:11px; }
  .op{ padding:15px; border-radius:13px; border:2px solid #d8e4d5; background:#fbfdfa; font-size:17px; font-weight:800;
    color:#33462f; cursor:pointer; transition:.15s; text-align:center; }
  .op:hover{ border-color:#8fc9a0; background:#f2faf3; }
  .op.sel-right{ background:#2e9d58; border-color:#2e9d58; color:#fff; }
  .op.sel-wrong{ background:#e0654f; border-color:#e0654f; color:#fff; animation:shake .4s; }
  .op:disabled{ cursor:default; }
  @keyframes shake{ 0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)} }
  .note{ min-height:26px; margin-top:14px; text-align:center; font-size:15px; font-weight:700; color:#2e7d44; }
  .hidden{ display:none; }
  .res .big{ font-size:52px; text-align:center; }
  .res h2{ text-align:center; margin:4px 0 14px; }
  .rrow{ display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px dashed #d8e2d5; font-size:15px; }
  .rrow b{ color:#2e7d44; }
  .miss-list{ margin-top:12px; max-height:150px; overflow:auto; font-size:13px; color:#8b5d45; line-height:1.9; }
  .again{ display:flex; gap:10px; margin-top:16px; }
  .again button{ flex:1; padding:13px; border-radius:12px; font-weight:800; cursor:pointer; border:none; }
  .b1{ background:linear-gradient(120deg,#3f9d5c,#2e7d44); color:#fff; }
  .b2{ background:#eef3ec; color:#55654f; border:1px solid #cddbca; }
</style>
</head>
<body>
<a class="back" href="../index.html#library" target="_top">‹ 返回展厅</a>
<h1>省份 · 省会 <span>大挑战</span></h1>
<div class="sub">共 28 个省、自治区（含台湾省）· 一起来记行政中心</div>

<!-- 设置 -->
<div class="card" id="setCard">
  <div class="opt2">出题方向</div>
  <div class="segs" id="dirSeg">
    <button class="seg on" data-v="A">省会 → 省</button>
    <button class="seg" data-v="B">省份 → 省会</button>
    <button class="seg" data-v="C">混合出战</button>
  </div>
  <div class="opt2">题量</div>
  <div class="segs" id="numSeg">
    <button class="seg on" data-v="8">快速 8 题</button>
    <button class="seg" data-v="14">标准 14 题</button>
    <button class="seg" data-v="28">全览 28 题</button>
  </div>
  <button class="go" id="startBtn">▶ 开始挑战</button>
</div>

<!-- 游戏 -->
<div class="card hidden" id="gameCard">
  <div class="hud"><span>得分 <b id="score">0</b></span><span>第 <b id="idx">1</b>/<b id="total">10</b> 题</span><span>连对 <b id="streak">0</b></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q"><span class="qtag" id="qtag">—</span>
    <div class="who" id="who">—</div>
    <div class="ask" id="ask"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="note" id="note"></div>
</div>

<!-- 结果 -->
<div class="card res hidden" id="resCard">
  <div class="big" id="emoji">🏆</div>
  <h2 id="resTitle">完成！</h2>
  <div class="rrow"><span>答对题数</span><b id="rAcc">0/0</b></div>
  <div class="rrow"><span>正确率</span><b id="rRate">0%</b></div>
  <div class="rrow"><span>最高连对</span><b id="rStreak">0</b></div>
  <div id="missBox"><div class="opt2" style="margin-top:14px;">🔍 错题回顾</div><div class="miss-list" id="missList"></div></div>
  <div class="again"><button class="b1" id="againBtn">再挑战一次</button><button class="b2" id="setBtn">更换设置</button></div>
</div>

<script>
const DATA=[
  ["河北省","石家庄"],["山西省","太原"],["辽宁省","沈阳"],["吉林省","长春"],["黑龙江省","哈尔滨"],
  ["江苏省","南京"],["浙江省","杭州"],["安徽省","合肥"],["福建省","福州"],["江西省","南昌"],
  ["山东省","济南"],["河南省","郑州"],["湖北省","武汉"],["湖南省","长沙"],["广东省","广州"],
  ["海南省","海口"],["四川省","成都"],["贵州省","贵阳"],["云南省","昆明"],["陕西省","西安"],
  ["甘肃省","兰州"],["青海省","西宁"],["台湾省","台北"],
  ["内蒙古自治区","呼和浩特"],["广西壮族自治区","南宁"],["西藏自治区","拉萨"],["宁夏回族自治区","银川"],["新疆维吾尔自治区","乌鲁木齐"]
];
const $=s=>document.querySelector(s);
let dir="A",num=8,cur=[],i=0,score=0,streak=0,maxStreak=0,miss=[],ansLock=false;

$("#dirSeg").addEventListener("click",e=>{ if(e.target.dataset.v){dir=e.target.dataset.v; sel("#dirSeg",e.target);}});
$("#numSeg").addEventListener("click",e=>{ if(e.target.dataset.v){num=+e.target.dataset.v; sel("#numSeg",e.target);}});
function sel(selEl,btn){ document.querySelectorAll(selEl+" .seg").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); }

function genList(){
  const rows=DATA.slice().sort(()=>Math.random()-.5).slice(0,num);
  return rows.map(d=>{
    const mode = dir==="C" ? (Math.random()<.5?"A":"B") : dir;  // A: 省会→省  B: 省→省会
    const ans  = mode==="A" ? d[0] : d[1];   // 答案（省的名称 / 省会城市）
    const give = mode==="A" ? d[1] : d[0];   // 题干给出
    const ansCol = mode==="A" ? 0 : 1;       // 干扰项取自答案同侧
    const dist = DATA.filter(x=>x!==d && x[0]!==ans && x[1]!==ans)
      .map(x=>x[ansCol]).sort(()=>Math.random()-.5).slice(0,3);
    return { q:give, a:ans, dirMode:mode, opts:[ans,...dist].sort(()=>Math.random()-.5) };
  });
}
function start(){
  cur=genList();
  score=0;i=0;streak=0;maxStreak=0;miss=[];
  $("#setCard").classList.add("hidden"); $("#resCard").classList.add("hidden"); $("#gameCard").classList.remove("hidden");
  render();
}
function render(){
  if(i>=cur.length) return finish();
  const q=cur[i];
  $("#score").textContent=score; $("#idx").textContent=i+1; $("#total").textContent=cur.length; $("#streak").textContent=streak;
  $("#bar").style.width=(i/cur.length*100)+"%";
  $("#qtag").textContent= q.dirMode==="A" ? "由省会找省份" : "由省份找省会";
  $("#who").textContent= q.dirMode==="A" ? ("🏙️ " + q.q) : ("📍 " + q.q);
  $("#ask").textContent= q.dirMode==="A" ? "它是下列哪个省 / 自治区？" : "它的行政中心（省会）是？";
  ansLock=false; $("#note").textContent="";
  $("#opts").innerHTML=q.opts.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join("");
  document.querySelectorAll("#opts .op").forEach(b=>b.onclick=()=>answer(b));
}
function answer(btn){
  if(ansLock) return; ansLock=true;
  const q=cur[i], v=btn.textContent;
  const good = q.opts[btn.dataset.k]===q.a && v===q.a;
  if(good){ btn.classList.add("sel-right"); score+=10; streak++; maxStreak=Math.max(maxStreak,streak);
    $("#note").textContent="✓ 正确！  "+q.q+" —— "+q.a;
  }else{ btn.classList.add("sel-wrong"); streak=0; miss.push(q.q+" · 行政中心是 "+q.a);
    const c=document.querySelector(`#opts .op`); [...document.querySelectorAll("#opts .op")].forEach(b=>{ if(b.textContent===q.a) b.classList.add("sel-right"); });
    $("#note").textContent="✗ 正确答案是 "+q.a;
  }
  setTimeout(()=>{ i++; render(); },1300);
}
function finish(){
  $("#gameCard").classList.add("hidden"); $("#resCard").classList.remove("hidden");
  const rate=Math.round(score/(cur.length*10)*100);
  const em= rate>=95?"🏆":rate>=80?"🥇":rate>=60?"🥈":"🌱";
  const t= rate>=95?"地理小达人！":rate>=80?"很棒，继续冲满分":rate>=60?"及格了，再来一轮":"多练几次就记住啦";
  $("#emoji").textContent=em; $("#resTitle").textContent=t;
  $("#rAcc").textContent=score/10+" / "+cur.length; $("#rRate").textContent=rate+"%"; $("#rStreak").textContent="×"+maxStreak;
  $("#missList").innerHTML=miss.length? miss.map(m=>"• "+m).join("<br>") : "🎉 全部答对，没有错题！";
  $("#missBox").style.display=miss.length?"":"none";
}
$("#startBtn").onclick=start;
$("#againBtn").onclick=start;
$("#setBtn").onclick=()=>{ $("#resCard").classList.add("hidden"); $("#setCard").classList.remove("hidden"); };
start();
</script>
<script src="sfx.js"></script>
</body>
</html>
