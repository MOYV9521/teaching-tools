<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; }
  :root{ --bg:#1a1a1a; --panel:#2d2d2d; --panel2:#222; --text:#00ff99; --dim:#8fbfaa; --accent:#00ced1;
         --border:#3a3a3a; --chip:#222; --hi:#123; --plotbg:#2d2d2d; --plottext:#ffffff; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); overflow:hidden; transition:.3s; }
  .app{ display:flex; flex-direction:column; height:100vh; }

  /* 顶部工具条 */
  .bar{ display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap;
        background:var(--panel); border-bottom:1px solid var(--border); }
  .bar select,.bar button,.bar .filelbl{ font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--border);
        background:var(--panel2); color:var(--text); cursor:pointer; transition:.2s; white-space:nowrap; }
  .bar button:hover,.bar .filelbl:hover{ background:var(--accent); color:#000; border-color:var(--accent); }
  .bar .grp{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .sep{ width:1px; height:22px; background:var(--border); margin:0 4px; }
  input[type=file]{ display:none; }
  .bar .brand{ font-weight:900; letter-spacing:1px; margin-right:4px; font-size:14px; }

  /* 主体 */
  .mid{ flex:1; display:flex; min-height:0; }
  .inputs{ display:flex; flex:1; gap:8px; padding:10px 12px; min-width:0; }
  .box{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .box h3{ font-size:12px; letter-spacing:1px; padding:7px 10px; border-bottom:1px solid var(--border); color:var(--dim); background:var(--panel2); }
  .box.hide{ display:none; }
  textarea{ flex:1; width:100%; border:0; outline:0; resize:none; background:var(--panel); color:var(--text);
            font-family:Consolas,"Courier New",monospace; font-size:14px; padding:10px; line-height:1.6; }
  .hint{ padding:6px 10px; font-size:11px; color:var(--dim); border-top:1px solid var(--border); background:var(--panel2); }

  /* 结果 */
  .result{ width:min(520px,46%); flex:none; background:var(--panel); border:1px solid var(--border); border-radius:10px; margin:10px 12px 10px 0; overflow:hidden; display:flex; flex-direction:column; }
  .result h3{ font-size:12px; padding:7px 10px; border-bottom:1px solid var(--border); color:var(--dim); background:var(--panel2); letter-spacing:1px; }
  .res-scroll{ flex:1; overflow:auto; padding:10px 12px; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.75; }
  .res-scroll::-webkit-scrollbar{ width:8px; }
  .res-scroll::-webkit-scrollbar-thumb{ background:var(--border); border-radius:9px; }
  .sec{ margin:12px 0; }
  .sec:first-child{ margin-top:0; }
  .sec h4{ font-size:12px; color:var(--accent); letter-spacing:1px; margin-bottom:6px; }
  .sub2{ color:var(--dim); font-size:12px; margin-bottom:10px; }
  .ln b{ color:var(--accent); }

  /* 底部状态栏 */
  .statusbar{ padding:6px 14px; font-size:12px; background:var(--panel); border-top:1px solid var(--border); color:var(--dim); display:flex; justify-content:space-between; gap:10px; }
  .statusbar b{ color:var(--text); font-weight:700; }

  /* toast */
  .toast{ position:fixed; left:50%; bottom:56px; transform:translateX(-50%); background:#000; color:#fff; padding:10px 22px;
          border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.3s; z-index:200; border:1px solid #555; }
  .toast.on{ opacity:1; }

  /* 弹层 */
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:150; padding:20px; }
  .overlay.on{ display:flex; }
  .pop{ background:var(--panel); border:1px solid var(--border); border-radius:14px; width:min(720px,100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .pop h3{ font-size:14px; padding:12px 16px; border-bottom:1px solid var(--border); color:var(--dim); }
  .pop .body{ padding:14px 16px; overflow:auto; flex:1; }
  .pop .foot{ display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--border); }
  .pop button{ font-size:13px; padding:8px 18px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; }
  .pop button.pri{ background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
  .dicthelp{ font-size:11px; color:var(--dim); background:var(--panel2); padding:8px 10px; border-radius:8px; margin-bottom:10px; line-height:1.7; }
  #chartArea{ text-align:center; }
  #chartArea canvas{ max-width:100%; height:auto; border-radius:8px; }

  @media (max-width:760px){
    .result{ display:none; }
    .inputs{ flex-direction:column; }
    .box{ min-height:0; }
  }
</style>

function setDictInfo(){ const n=Object.keys(vocab).length;
  $("#stDict").textContent = n ? (dictName+" · "+n+" 词 · 最长词 "+maxLen+" 字") : "词典：未加载"; }

/* ================= 词典 ================= */
const CN_NUM={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6};
function loadDictText(text,name){
  dictName=name||"已导入词典"; vocab={}; let n=0;
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim();
    if(!line || line.startsWith("#")) return;
    const m=line.split(/[\t ,，;；]+/);           // 兼容多种分隔符
    if(m.length<2) return;
    let lv=m[1].replace(/级/g,"").trim();
    if(CN_NUM[lv]) lv=CN_NUM[lv];
    else if(/^\d+$/.test(lv)) lv=parseInt(lv,10);
    else return;
    if(!(lv>=1) || !(lv<=6)) return;
    const word=m[0].trim();
    if(!word || /^(生词|词|词语|HSK|单词)$/i.test(word)) return;   // 跳过表头
    vocab[word]=lv; n++;
  });
  maxLen=Math.max(0,...Object.keys(vocab).map(w=>w.length));
  if(n===0) { toast("词典格式错误或为空，请检查后重试"); status("词典加载失败"); setDictInfo(); return false; }
  setDictInfo(); status("已加载 "+n+" 个 HSK 词汇（"+(name||"导入")+"）"); return true;
}
/* 确保词典可用：优先官方词表文件，失败则退回内置示例词表 */
async function ensureDict(){
  if(Object.keys(vocab).length) return true;
  try{
    const r=await fetch("HSKvocabulary.txt");
    if(r.ok){ const t=await r.text(); if(loadDictText(t,"官方词典 HSKvocabulary.txt")) return true; }
  }catch(e){ /* 直接走内置示例词表 */ }
  return loadDictText(BUILTIN_TXT,"内置示例词表");
}

/* ================= 分析算法（与桌面版一致：最长词优先） ================= */
function analyzeText(text){
  const wc={}, lv={};
  let i=0, total=0; const L=text.length;
  while(i<L){
    let hit=false;
    const lim=Math.min(maxLen, L-i);
    for(let len=lim; len>=1; len--){
      const cand=text.substr(i,len);
      if(Object.prototype.hasOwnProperty.call(vocab,cand)){
        wc[cand]=(wc[cand]||0)+1;
        const l=vocab[cand]; lv[l]=(lv[l]||0)+1;
        total++; i+=len; hit=true; break;
      }
    }
    if(!hit) i++;
  }
  const top=Object.keys(wc).map(w=>({w,c:wc[w],l:vocab[w]}))
    .sort((a,b)=> b.c-a.c || b.w.length-a.w.length || (a.w<b.w?-1:1)).slice(0,15);
  return {chars:L, total, top, lv, wc};
}
function levelRows(lv){
  const rows=[];
  Object.keys(lv).map(Number).sort((a,b)=>a-b).forEach(l=>{
    rows.push(esc("HSK")+l+esc("级：")+lv[l]+esc(" 词"));
  });
  return rows.join("<br>") || '<span style="color:var(--dim)">（无匹配词汇）</span>';
}
function topRows(top){
  if(!top.length) return '<span style="color:var(--dim)">（无匹配词汇）</span>';
  return top.map(o=>esc(o.w+'（HSK'+o.l+'级）：')+o.c+esc(' 次')).join("<br>");
}

/* ================= 文本读写 ================= */
function readFileAsText(file, cb){
  const r=new FileReader();
  r.onload=e=>cb(e.target.result);
  r.onerror=()=>toast("文件读取失败");
  r.readAsText(file,"utf-8");
}
function putInFirst(){  // 双文本模式：优先填第一个空框
  return doubleMode && $("#text1").value.trim() ? 2 : 1;
}

/* ================= 开始分析 ================= */
function analyze(){
  if(!Object.keys(vocab).length){ toast("请先加载 HSK 词典（内置词表已就绪则直接可用）"); return; }
  const t1=$("#text1").value.trim();
  if(!t1){ toast("请输入需要分析的文本 1"); return; }
  resA=analyzeText(t1);
  let html="";
  if(doubleMode){
    const t2=$("#text2").value.trim();
    if(!t2){ toast("请输入第二个需要分析的文本"); resA=null; return; }
    resB=analyzeText(t2);
    html=renderBlock(1,t1,resA)+renderBlock(2,t2,resB)+renderCompare(t1,t2,resA,resB);
    status("双文本分析完成，文本1匹配 "+resA.total+" 词，文本2匹配 "+resB.total+" 词");
  }else{
    resB=null;
    html=renderBlock(1,t1,resA);
    status("分析完成，匹配到 "+resA.total+" 个词汇");
  }
  $("#resOut").innerHTML=html;
}
function renderBlock(n,txt,res){
  return `<div class="sec"><h4>文本${n} · 基础信息</h4><div class="sub2">总字符数：${res.chars}　匹配词汇：${res.total}</div></div>
  <div class="sec"><h4>高频词汇 TOP15</h4>${topRows(res.top)}</div>
  <div class="sec"><h4>HSK 等级分布</h4>${levelRows(res.lv)}</div>`;
}
function renderCompare(t1,t2,a,b){
  const A=Object.keys(a.wc), B=Object.keys(b.wc);
  const common=A.filter(w=>B.indexOf(w)>=0), u1=A.filter(w=>B.indexOf(w)<0), u2=B.filter(w=>A.indexOf(w)<0);
  // 相似度 = Σmin(count)/Σmax(count)（已匹配词汇级加权）
  const union={}; A.forEach(w=>union[w]=[a.wc[w],0]); B.forEach(w=>{ if(union[w])union[w][1]=b.wc[w]; else union[w]=[0,b.wc[w]]; });
  let mn=0,mx=0; Object.values(union).forEach(([x,y])=>{ mn+=Math.min(x,y); mx+=Math.max(x,y); });
  const sim= mx? (mn/mx*100).toFixed(2) : "0.00";
  let rows="";
  const cmp=(x,y)=>x<y?-1:x>y?1:0;
  const all=[];
  common.forEach(w=>all.push({w,t:1,c1:a.wc[w],c2:b.wc[w]}));
  u1.forEach(w=>all.push({w,t:2,c1:a.wc[w],c2:0}));
  u2.forEach(w=>all.push({w,t:3,c1:0,c2:b.wc[w]}));
  all.sort((p,q)=>cmp(p.w,q.w));
  rows=all.map(o=>{
    const flag= o.t===1?"共同":(o.t===2?"仅文本1":"仅文本2");
    return esc(o.w+"（HSK"+vocab[o.w]+"级）：文本1 "+o.c1+" 次，文本2 "+o.c2+" 次　["+flag+"]");
  }).join("<br>") || '<span style="color:var(--dim)">（两个文本均未匹配到词汇）</span>';
  return `<div class="sec" style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px"><h4>双文本对比分析</h4>
    <div class="sub2">共同词汇 ${common.length} 个　·　文本1 独有 ${u1.length} 个　·　文本2 独有 ${u2.length} 个</div>
    <div class="sub2">文本相似度（基于已匹配词汇的加权重叠）：<b style="color:var(--accent)">${sim}%</b></div></div>
  <div class="sec"><h4>逐词对比（按拼音排序）</h4>${rows}</div>`;
}

/* ================= 图表 ================= */
function getChartData(){ // 返回 {mode:'pie'|'singleBar'|'compareBar'}
  if(!resA){ toast("请先进行文本分析"); return null; }
  if(doubleMode && !resB){ toast("请先完成双文本分析"); return null; }
  return doubleMode ? {mode:"compareBar"} : {mode: chartType==="柱状图" ? "singleBar" : "pie"};
}
function drawChart(theme){
  const data=getChartData(); if(!data) return false;
  const cv=document.createElement("canvas"); cv.width=1760; cv.height=1080;
  const ctx=cv.getContext("2d"); ctx.scale(2,2); W=880,H=540;
  ctx.fillStyle=theme.plotbg; ctx.fillRect(0,0,880,540);
  ctx.fillStyle=theme.plottext; ctx.font="600 19px 'Microsoft YaHei'"; ctx.textAlign="center";
  const plotW=720;
  if(data.mode==="pie"){
    const lv=resA.lv; const keys=Object.keys(lv).map(Number).sort((a,b)=>a-b);
    const total=keys.reduce((s,k)=>s+lv[k],0);
    ctx.font="900 22px 'Microsoft YaHei'"; ctx.fillText("HSK 等级分布", plotW/2, 46);
    ctx.font="13px 'Microsoft YaHei'"; ctx.fillStyle=theme.dim||theme.plottext; ctx.fillText("词汇数量共 "+total+"（按已匹配词汇计次）", plotW/2, 70);
    if(total>0){
      let start=-Math.PI/2;
      keys.forEach((k,i)=>{
        const ang=lv[k]/total*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(300,300); ctx.arc(300,300,170,start,start+ang);
        ctx.closePath(); ctx.fillStyle=PALETTE[i%PALETTE.length]; ctx.fill();
        ctx.strokeStyle=theme.plotbg; ctx.lineWidth=3; ctx.stroke();
        if(ang>0.08){ ctx.save(); ctx.translate(300,300); ctx.rotate(start+ang/2);
          ctx.fillStyle=theme.plotbg; ctx.textAlign="center"; ctx.font="bold 14px 'Microsoft YaHei'";
          ctx.fillText((lv[k]/total*100).toFixed(1)+"%", 118, 5); ctx.restore(); }
        start+=ang;
      });
      let ly=170;
      keys.forEach((k,i)=>{
        ctx.fillStyle=PALETTE[i%PALETTE.length]; ctx.fillRect(560,ly-14,20,20);
        ctx.fillStyle=theme.plottext; ctx.textAlign="left"; ctx.font="600 15px 'Microsoft YaHei'";
        ctx.fillText("HSK"+k+" 级："+lv[k]+" 词（"+(lv[k]/total*100).toFixed(1)+"%）", 592, ly+2);
        ly+=34;
      });
    }
  }else{
    const l1=resA.lv, l2=resB&&resB.lv||{};
    const keys=[];
    Object.keys(l1).concat(Object.keys(l2)).map(Number).forEach(k=>{ if(keys.indexOf(k)<0) keys.push(k); });
    keys.sort((a,b)=>a-b);
    const ctx2=ctx;
    const title= data.mode==="compareBar" ? "HSK 等级分布对比" : "HSK 等级分布";
    ctx2.font="900 22px 'Microsoft YaHei'"; ctx2.textAlign="center"; ctx2.fillText(title, plotW/2, 44);
    const L=70, R=740, T=90, B=470;
    const slot=(R-L)/keys.length;
    const maxV=keys.reduce((m,k)=>Math.max(m,l1[k]||0,l2[k]||0),1);
    // 网格线
    ctx2.strokeStyle=theme.dim||"#888"; ctx2.fillStyle=theme.dim||theme.plottext; ctx2.font="12px 'Microsoft YaHei'";
    for(let g=0;g<=4;g++){
      const y=T+(B-T)*(1-g/4), v=Math.ceil(maxV*g/4);
      ctx2.globalAlpha=.25; ctx2.beginPath(); ctx2.moveTo(L,y); ctx2.lineTo(R,y); ctx2.stroke();
      ctx2.globalAlpha=1; ctx2.textAlign="right"; ctx2.fillText(v,L-6,y+4);
    }
    ctx2.strokeStyle=theme.plottext; ctx2.lineWidth=2;
    ctx2.beginPath(); ctx2.moveTo(L,T-6); ctx2.lineTo(L,B); ctx2.lineTo(R,B); ctx2.stroke();
    const bw=Math.min(52,(slot-12)/2);
    keys.forEach((k,i)=>{
      const cx=L+slot*i+slot/2;
      ctx2.fillStyle=theme.plottext; ctx2.textAlign="center"; ctx2.font="600 14px 'Microsoft YaHei'";
      ctx2.fillText("HSK"+k, cx, B+20);
      const h1=(l1[k]||0)/maxV*(B-T), h2=(l2[k]||0)/maxV*(B-T);
      if(data.mode==="compareBar"){
        ctx2.fillStyle=PALETTE[0]; ctx2.fillRect(cx-bw-3,B-h1,bw,h1);
        ctx2.fillStyle=PALETTE[1]; ctx2.fillRect(cx+3,B-h2,bw,h2);
      }else{
        ctx2.fillStyle=theme.accent; ctx2.fillRect(cx-bw,B-h1,bw*2,h1);
      }
    });
    if(data.mode==="compareBar"){
      ctx2.font="13px 'Microsoft YaHei'"; ctx2.textAlign="left";
      ctx2.fillStyle=PALETTE[0]; ctx2.fillRect(560-150,500,16,16);
      ctx2.fillStyle=PALETTE[1]; ctx2.fillRect(660-150,500,16,16);
      ctx2.fillStyle=theme.dim||theme.plottext;
      ctx2.fillText("文本1", 552-150+20, 512); ctx2.fillText("文本2", 652-150+20, 512);
    }else{
      ctx2.font="12px 'Microsoft YaHei'"; ctx2.textAlign="center"; ctx2.fillStyle=theme.dim||theme.plottext;
      ctx2.fillText("词汇数量按已匹配词汇计次", plotW/2, 518);
    }
  }
  return cv;
}
function openChart(){
  const theme=THEMES[curTheme];
  const cv=drawChart(theme); if(!cv) return;
  $("#chartArea").innerHTML=""; $("#chartArea").appendChild(cv);
  $("#chartTitle").textContent = doubleMode ? "HSK 等级分布对比图" : ("HSK 等级分布图 · "+chartType);
  $("#ovChart").classList.add("on");
}
function exportChartPng(){
  const theme=THEMES[curTheme];
  const cv=drawChart(theme); if(!cv) return;
  const a=document.createElement("a");
  a.href=cv.toDataURL("image/png");
  a.download="hsk_等级分布_"+Date.now()+".png";
  a.click();
  toast("图表 PNG 已导出");
}

/* ================= 导出 ================= */
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),900);
}
function csvEsc(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }
function exportCsv(){
  if(!resA){ toast("没有可导出的分析结果"); return; }
  let csv="";
  if(doubleMode&&resB){
    const A=resA.wc,B=resB.wc,union=[];
    Object.keys(A).forEach(w=>{ if(B[w]!=null){union.push([w,'是',A[w],B[w]]);} });
    Object.keys(A).forEach(w=>{ if(B[w]==null){union.push([w,'否',A[w],0]);} });
    Object.keys(B).forEach(w=>{ if(A[w]==null){union.push([w,'否',0,B[w]]);} });
    union.sort((a,b)=>a[0]<b[0]?-1:1);
    csv="词语,HSK等级,是否共同词汇,文本1出现次数,文本2出现次数\r\n"+
        union.map(r=>[csvEsc(r[0]),csvEsc("HSK"+vocab[r[0]]+"级"),csvEsc(r[1]),r[2],r[3]].join(",")).join("\r\n");
    download("hsk_双文本对比_"+Date.now()+".csv","\uFEFF"+csv,"text/csv;charset=utf-8");
  }else{
    csv="词语,出现次数,HSK等级\r\n"+
        Object.keys(resA.wc).map(w=>[csvEsc(w),resA.wc[w],csvEsc("HSK"+vocab[w]+"级")].join(",")).join("\r\n");
    download("hsk_词汇分析_"+Date.now()+".csv","\uFEFF"+csv,"text/csv;charset=utf-8");
  }
  toast("CSV 已导出");
}
function exportTxt(){
  if(!resA){ toast("没有可导出的分析结果"); return; }
  let out="";
  if(doubleMode&&resB){
    out+="=== HSK 双文本对比分析报告 ===\n\n";
    out+="文本1总字符数："+resA.chars+"　匹配词汇量："+resA.total+"\n";
    out+="文本2总字符数："+resB.chars+"　匹配词汇量："+resB.total+"\n\n";
    out+="【文本1 高频词TOP15】\n"+resA.top.map(o=>`${o.w}（HSK${o.l}级）：${o.c}次`).join("\n")+"\n\n";
    out+="【文本2 高频词TOP15】\n"+resB.top.map(o=>`${o.w}（HSK${o.l}级）：${o.c}次`).join("\n")+"\n\n";
    const common=Object.keys(resA.wc).filter(w=>resB.wc[w]!=null);
    out+="【共同词汇】"+common.length+" 个：\n"+common.map(w=>`${w}（HSK${vocab[w]}级）：文本1 ${resA.wc[w]}次，文本2 ${resB.wc[w]}次`).join("\n")+"\n";
    download("hsk_分析报告_"+Date.now()+".txt",out);
  }else{
    out+="=== HSK 词汇分析报告 ===\n\n";
    out+="总字符数："+resA.chars+"　总匹配词汇量："+resA.total+"\n\n";
    out+="【词汇统计（按次数排序）】\n"+
        Object.keys(resA.wc).sort((a,b)=>resA.wc[b]-resA.wc[a]||a<b?-1:1)
          .map(w=>`${w}\t${resA.wc[w]}次\tHSK${vocab[w]}级`).join("\n")+"\n\n";
    out+="【等级分布】\n"+Object.keys(resA.lv).map(Number).sort((a,b)=>a-b)
          .map(l=>`HSK${l}级: ${resA.lv[l]}词`).join("\n")+"\n";
    download("hsk_分析报告_"+Date.now()+".txt",out);
  }
  toast("报告已导出");
}

/* ================= 交互绑定 ================= */
function fillSel(sel,items,val){ sel.innerHTML=items.map(x=>`<option ${x===val?"selected":""}>${x}</option>`).join(""); }
(function init(){
  const ts=$("#themeSel"); fillSel(ts,Object.keys(THEMES),curTheme);
  ts.onchange=()=>{ curTheme=ts.value; applyTheme(THEMES[curTheme]); status("已切换至 "+curTheme); };
  const cs=$("#chartSel");
  cs.onchange=()=>{ chartType=cs.value; };
  $("#btnMode").onclick=()=>{
    doubleMode=!doubleMode;
    $("#box2").classList.toggle("hide",!doubleMode);
    $("#btnMode").textContent= doubleMode? "⇄ 切换到单文本分析" : "⇄ 切换到双文本分析";
    if(!doubleMode){ $("#text2").value=""; resB=null; }
    status("已切换到 "+ (doubleMode?"双文本分析":"单文本分析") +" 模式");
  };
  /* 加载示例：载入示例作文并立即分析（自动保证词典就绪） */
  $("#btnDemo").onclick=async ()=>{
    const t1=$("#text1"), t2=$("#text2");
    if(doubleMode){
      if(!t1.value.trim()) t1.value=DEMO_A.trim();
      else if(!t2.value.trim()) t2.value=DEMO_B.trim();
      else t1.value=DEMO_A.trim();
    } else t1.value=DEMO_A.trim();
    status("已载入示例文本，正在准备词典…");
    await ensureDict();
    analyze();
    if(Object.keys(vocab).length) toast("示例已加载并完成分析");
  };
  $("#btnBuiltin").onclick=()=>{ loadDictText(BUILTIN_TXT,"内置示例词表"); toast("已切换为内置示例词表"); };
  $("#btnPasteDict").onclick=()=>{ $("#dictTa").value=""; $("#ovDict").classList.add("on"); setTimeout(()=>$("#dictTa").focus(),60); };
  $("#btnDictCancel").onclick=()=>$("#ovDict").classList.remove("on");
  $("#btnDictOk").onclick=()=>{ const v=$("#dictTa").value.trim(); if(!v){toast("粘贴内容为空");return;}
    if(loadDictText(v,"粘贴词典")){ $("#ovDict").classList.remove("on"); toast("词典导入成功"); } };
  $("#dictFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return;
    readFileAsText(f,t=>{ if(loadDictText(t,"文件："+f.name)) toast("词典文件已导入："+f.name); }); e.target.value=""; });
  $("#textFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return;
    readFileAsText(f,t=>{ const target=putInFirst(); $("#text"+target).value=t;
      status("已加载文件："+f.name); toast("文件内容已载入文本"+target); }); e.target.value=""; });
  $("#btnAnalyze").onclick=analyze;
  $("#btnChart").onclick=openChart;
  $("#btnChartClose").onclick=()=>$("#ovChart").classList.remove("on");
  $("#ovChart").addEventListener("click",e=>{ if(e.target===$("#ovChart")) $("#ovChart").classList.remove("on"); });
  $("#ovDict").addEventListener("click",e=>{ if(e.target===$("#ovDict")) $("#ovDict").classList.remove("on"); });
  $("#btnExportCsv").onclick=exportCsv;
  $("#btnExportChart").onclick=exportChartPng;
  $("#btnExportTxt").onclick=exportTxt;
  $("#btnClear").onclick=()=>{ $("#text1").value=""; $("#text2").value=""; $("#resOut").innerHTML="";
    resA=resB=null; status("已清空所有内容"); };
  applyTheme(THEMES[curTheme]);
  loadDictText(BUILTIN_TXT,"内置示例词表");
  status("正在自动加载配套官方词典 HSKvocabulary.txt …");
  /* 优先自动读取同目录下的官方词表文件（展厅经本地服务器访问时可用） */
  fetch("HSKvocabulary.txt")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(t=>{ if(loadDictText(t,"官方词典 HSKvocabulary.txt"))
      { toast("官方 HSK 词典已自动加载（"+Object.keys(vocab).length+" 词）"); } })
    .catch(()=>{ status("未检测到本地词典文件，已启用内置示例词表，可直接体验"); });
})();
</script>
